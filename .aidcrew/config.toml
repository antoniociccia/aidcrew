# Written by aidcrew. Safe to edit and to commit — it holds no secrets.

[sources]
instructions = ["~/.codex/AGENTS.md"]
agents = ["~/.claude/agents","./.claude/agents"]
orchestration = ["./ORCHESTRATE.md"]

[defaults]
maxMessagesPerTurn = 12
provider = "opencode-go"
model = "muse-spark-1.3-contributor"
sharedMemory = true
leader = "architect"

[agents.architect]
yolo = true
provider = "claude-code"
model = "native"

[agents.coder]
yolo = true
provider = "claude-code"
model = "native"

[agents.reviewer]
yolo = true
provider = "opencode-go"
model = "muse-spark-1.3-contributor"

[agents.tester]
yolo = true
provider = "opencode-go"
model = "muse-spark-1.3-contributor"

[agents.plugin-writer]
yolo = true
provider = "opencode-go"
model = "muse-spark-1.3-contributor"

# Go reasoning can pause longer than the default 60-second stream idle limit.
[plugins.provider-openai-compat.providers.opencode-go]
firstByteTimeoutMs = 180000
idleTimeoutMs = 180000
