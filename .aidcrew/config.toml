[sources]
instructions = ["./CLAUDE.md"]
agents = ["~/.claude/agents","./.claude/agents"]
orchestration = ["./ORCHESTRATE.md"]

[defaults]
provider = "zen"
model = "deepseek-v4-flash"
sharedMemory = true
leader = "architect"

[agents.architect]
provider = "anthropic"
model = "claude-opus-5"

[agents.coder]
provider = "zen"
model = "deepseek-v4"

[agents.reviewer]
provider = "zen"
model = "deepseek-v4-flash-free"

[agents.tester]
provider = "zen"
model = "deepseek-v4-flash"

[agents.plugin-writer]
provider = "zen"
model = "deepseek-v4"
